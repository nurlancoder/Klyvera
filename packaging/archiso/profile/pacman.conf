[options]
HoldPkg = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Prototype local repository. Packages are unsigned until release signing is
# configured; release builds must not use TrustAll.
[klyvera]
SigLevel = Optional TrustAll
Server = file:///var/cache/klyvera/localrepo/$arch
