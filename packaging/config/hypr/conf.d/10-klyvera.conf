# Klyvera shell bindings. Keep compositor rules in the maintainer's own config;
# this fragment only wires Klyvera surfaces and safe session actions.
$klyvera = qs -c klyvera

exec-once = $klyvera

bind = SUPER, SPACE, exec, $klyvera ipc call launcher toggle
bind = SUPER, C, exec, $klyvera ipc call controlcenter toggle
bind = SUPER, N, exec, $klyvera ipc call notifications toggle
bind = SUPER, ESCAPE, exec, $klyvera ipc call session toggle
bind = SUPER, L, exec, loginctl lock-session
bind = SUPER, RETURN, exec, foot
bind = SUPER, I, exec, foot -a klyvera-installer archinstall
