version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
