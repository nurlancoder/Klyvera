<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Klyvera Spaces dashboard illustration</title>
  <desc id="desc">An original dark desktop interface illustration showing a project list, workspace details, folders and launch actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171a2b"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b2a5ff"/>
      <stop offset="1" stop-color="#7c68f5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8875ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8875ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02030a" flood-opacity=".36"/>
    </filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f6fb}
      .muted{fill:#aeb6ca}.quiet{fill:#7f899f}.small{font-size:17px}.body{font-size:20px}
      .label{font-size:15px;font-weight:700;letter-spacing:1.2px}.title{font-size:30px;font-weight:700}
      .line{stroke:#2a2e3c;stroke-width:1}.icon{fill:none;stroke:#aeb6ca;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="80" r="380" fill="url(#glow)"/>
  <rect x="1" y="1" width="1438" height="898" rx="27" fill="none" stroke="#343848"/>
