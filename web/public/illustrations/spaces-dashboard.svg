  <text x="965" y="682" class="small quiet">org.klyvera.Terminal.desktop</text>
  <rect x="907" y="704" width="42" height="42" rx="11" fill="#202433"/>
  <path d="m921 716-6 6 6 6m13-12 6 6-6 6m-4-15-4 18" class="icon"/>
  <text x="965" y="732" class="small">Code editor</text>
  <rect x="372" y="800" width="1011" height="54" rx="15" fill="#11151d" stroke="#29303a"/>
  <circle cx="401" cy="827" r="6" fill="#5fe0b3"/>
  <text x="421" y="834" class="small muted">Your data stays on this device. No account. No cloud dependency.</text>
  <text x="1325" y="834" class="small quiet">KLYVERA 0.1</text>
